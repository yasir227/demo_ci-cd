name: Docker + Lint + Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # LINT + TESTS (auto-detect)
      # -------------------------
      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python install + lint + tests (ruff + pytest)
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install ruff pytest; fi

          echo "---- LINT (ruff) ----"
          ruff --version || true
          ruff check . || (echo "Ruff lint failed" && exit 1)

          echo "---- TESTS (pytest) ----"
          pytest -q || (echo "Pytest failed" && exit 1)

      - name: Set up Node
        if: hashFiles('package-lock.json', 'package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Node install + lint + tests (npm)
        if: hashFiles('package-lock.json', 'package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

          echo "---- LINT (npm run lint) ----"
          npm run lint || (echo "npm lint failed (make sure you have a lint script)" && exit 1)

          echo "---- TESTS (npm test) ----"
          npm test || (echo "npm test failed" && exit 1)

      # -------------------------
      # DOCKER BUILD
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t myapp:ci .
          docker images | head -n 20
